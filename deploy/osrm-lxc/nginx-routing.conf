# HTTPS gateway for the dedicated OSRM LXC. Replace host and certificate paths.
server {
    listen 443 ssl;
    server_name routing.example.org;
    ssl_certificate /etc/letsencrypt/live/routing.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/routing.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Routing URLs contain coordinates: do not persist request/access/error traces.
    access_log off;
    error_log /dev/null crit;

    auth_basic "Heimweg Routing";
    auth_basic_user_file /etc/nginx/heimweg-osrm.htpasswd;

    # Optional second layer: uncomment and insert the app server's actual source IP.
    # satisfy all;
    # allow 203.0.113.10;
    # deny all;

    # The application only requires OSRM's table endpoint, not all routing APIs.
    location /table/v1/driving/ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host localhost;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 25s;
        proxy_send_timeout 25s;
        proxy_cache off;
        proxy_buffering off;
    }
    location / { return 404; }
}
