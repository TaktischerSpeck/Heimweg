# Replace the hostname and keep this HTTP server for certificate renewals.
server {
    listen 80;
    server_name routing.example.org;
    access_log off;
    error_log /dev/null crit;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / { return 404; }
}
