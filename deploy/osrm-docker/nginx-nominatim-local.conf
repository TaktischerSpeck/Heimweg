# Additional HTTPS endpoint in the same LXC; reuse its existing internal certificate.
server {
    listen 4433 ssl;
    server_name osrm.internal;
    ssl_certificate /etc/nginx/osrm-tls/server.crt;
    ssl_certificate_key /etc/nginx/osrm-tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log off;
    error_log /dev/null crit;

    auth_basic "Heimweg Geocoding";
    auth_basic_user_file /etc/nginx/heimweg-nominatim.htpasswd;

    # Optional: also require the external reverse proxy's actual source IP.
    # satisfy all;
    # allow 192.0.2.10;
    # deny all;

    location = /search {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host localhost;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 25s;
        proxy_send_timeout 25s;
        proxy_cache off;
        proxy_buffering off;
    }
    location / { return 404; }
}
