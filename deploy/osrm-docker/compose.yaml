services:
  osrm:
    image: ${OSRM_IMAGE:?Set OSRM_IMAGE to the recorded OSRM image digest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./data:/data:ro
    command: ["osrm-routed", "--algorithm", "mld", "--max-table-size", "100", "--verbosity", "ERROR", "/data/region.osrm"]
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "2"
