# Include in an existing TLS-enabled server block.
location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 70s;
    proxy_send_timeout 70s;
    proxy_cache off;
    client_max_body_size 32k;
}
# Do not enable request-body, query-string or Cookie logging.
# This format contains neither query strings nor personal request bodies.
# Define in the http block, then select inside the server block:
# log_format heimweg '$remote_addr $request_method $uri $status';
# access_log /var/log/nginx/heimweg.log heimweg;
